name: Validate Agent-Skill Tool Compatibility

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate agent-skill tool compatibility
        run: python scripts/validate_agent_skill_tools.py
